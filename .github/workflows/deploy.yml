name: Deploy a GitHub Pages

# Cada push a la rama `produccion` compila el juego y publica la carpeta `dist` en la rama `gh-pages`.
# (`main` y `villa` ya no publican: para publicar, pushear a `produccion`, por ejemplo `git push origin villa:produccion`.)
# En Settings → Pages hay que elegir: Source = "Deploy from a branch", Branch = gh-pages, carpeta = / (root).
on:
  push:
    branches: [produccion]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar dist en gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Publicar ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
